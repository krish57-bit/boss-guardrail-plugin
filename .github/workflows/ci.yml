name: CI

# Builds the plugin jar against the pinned boss-plugin-api release, checks the
# jar is loadable by BOSS (PluginLoadTest + verifyPluginJar), and runs every test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify the plugin jar
        run: |
          set -o pipefail
          ./gradlew check buildPluginJar --no-daemon --continue 2>&1 | tee build.log

      # Put the compiler and test failures where the PR page shows them.
      - name: Report build failures on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### CI failure details'
            echo '```'
            grep -E '^e: |FAILED|What went wrong|Exception|expected|but was|\.kt:[0-9]+' build.log | head -150
            echo '```'
            for f in build/test-results/test/*.xml; do
              [ -f "$f" ] || continue
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for tc in r.iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fl.get('message') or '')[:400]
                  print(f"- `{tc.get('classname')}.{tc.get('name')}`: {msg}")
          PY
            done | head -80
          } > failure.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file failure.md

      # A green run with zero integration tests would prove nothing.
      - name: Assert the host-integration tests ran
        run: |
          for t in HostIntegrationTest PluginLoadTest StrictModeTest; do
            f="build/test-results/test/TEST-ai.boss.guardrail.boss.$t.xml"
            test -f "$f" || { echo "::error::$t produced no results"; exit 1; }
            grep -q 'skipped="0"' "$f" || { echo "::error::$t skipped tests"; exit 1; }
            grep -q 'tests="[1-9]' "$f" || { echo "::error::$t ran zero tests"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-and-test-reports
          path: |
            build/libs/boss-guardrail-plugin-*.jar
            build/reports/tests/
